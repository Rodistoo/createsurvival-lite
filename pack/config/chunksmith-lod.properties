# Chunksmith LOD client.
#
# Both settings can also be changed in-game with /cslod set <name> <value>, which applies
# the value immediately and rewrites this file. Editing by hand still works; the file is
# read at startup.
#
# sync-interval-seconds: how often (in SECONDS) to ask the server whether its LOD store
# has changed. The check itself is two tiny messages; a full index is only pulled when the
# answer is 'yes'. This is what lets a player who is STANDING STILL pick up terrain from a
# pregen that is still running, with no relog and no need to go for a walk.
#
# Default 300. Values below 30 are clamped to 30.
#
# reinject-on-join: normally Chunksmith remembers which LOD regions it has already
# given to your renderer, so joining a world does not re-send terrain voxy or Distant
# Horizons already has. Set this to true for ONE join if you have deleted or reset your
# renderer's own data and want everything sent again. Default false.
#
# max-disk-mb: a ceiling, in MEGABYTES, on what Chunksmith will store per
# dimension per server. 0 (the default) means no ceiling, which is how every version
# before 4.0.0 behaved. How much arrives is otherwise entirely the server's choice.
# Regions nearest you are kept first, so a ceiling shortens your far horizon rather
# than leaving gaps nearby.
#Wed Oct 21 02:29:13 CEST 2026
max-disk-mb=0
reinject-on-join=false
sync-interval-seconds=300
