#Minecarts (feature minecarts).
[minecarts]
	#Rotate with Minecarts: your view turns with a minecart you ride when it turns (as vanilla's option of
	#1.21.2+ with Minecart Improvements).
	rotateWithMinecart = false

#The colour of the void at a dimension's edge (feature terrain).
[voidColors]
	#"<dimension> <from y> <to y> <#rrggbb>": from the first height on, the fog (and the sky below the horizon) turns
	#to the colour, all of it at the second, e.g. "minecraft:overworld -45 -85 #3a0707" (dark red towards the bottom)
	#or "minecraft:the_nether 130 168 #0a1238" (dark blue towards the top).
	voidColors = ["minecraft:overworld -40 -85 #3a0707", "minecraft:the_nether 130 168 #0a1238"]

#Chat.
[chat]
	#Chat messages that aren't shown (nor logged): regular expressions matched against the whole message,
	#e.g. "\\[Axiom\\] The Editor UI keybind has conflicts.*" for a mod's message that can't be switched off.
	hiddenMessages = ["\\[Axiom\\] The Editor UI keybind has conflicts.*"]

#The fog at a rectangular world border (feature worldBorder, /createsurvival_core border set).
[borderFog]
	#Fog at the border: nothing behind it is seen (Distant Horizons doesn't draw past it either).
	borderFog = true
	#How far in front of the border the fog starts, in blocks; it thickens towards the border.
	# Default: 48
	# Range: 4 ~ 256
	fogDepth = 48
	#Layers the fog in front of the border is made of (more: smoother, a little slower).
	# Default: 32
	# Range: 1 ~ 64
	fogLayers = 12
