# Enable debug logging
debugLogging=false

# If true, replace all Immersive Railroading rails with the block specified in 'overrideBlockId'
overrideIrRailBlock=false

# Block ID to replace IR rails with (e.g., 'minecraft:stone', 'minecraft:diamond_block').If the ID is invalid or the block does not exist, falls back to 'minecraft:soul_sand'.
overrideIrRailBlockId=minecraft:soul_sand

# bedFill color will be correct faster, may slow down speed.
getIrDataFromParentDirectly=false

# Replace the color if IR bedFill is Air.
replaceIrIfAir=false

# Enable database caching (requires restart)
enableDatabase=true

# Use asynchronous database writes (may improve performance but could lose data on crash)
useAsyncDbWrite=true

