#General settings
[general]
	#Items that should not be transferred to curios slots (format: 'modid:item' or '#modid:tag')
	blacklisted_items = []
	#Whether cursed items (Curse of Binding) should be transferred back to curios slots
	transfer_cursed_items = false
	#Curio slot types that items should never be restored into (e.g. 'ring', 'back')
	blacklisted_slots = []
	#If the original curio slot is already occupied, put the restored item back into it and move the current item to the inventory (items with Curse of Binding are never swapped out)
	swap_occupied_slots = false
