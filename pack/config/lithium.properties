# This is the configuration file for Lithium.
#
# You can find information on editing this file and all the available options here:
# https://github.com/CaffeineMC/lithium-fabric/wiki/Configuration-File
#
# By default, this file will be empty except for this notice.

# CreateSurvival: Tree Physics lets players walk through leaves by changing vanilla's block collision check
# (BlockCollisions). Lithium's entity collision code doesn't use it, so leaves were solid again whenever it ran.
mixin.entity.collisions.movement=false
mixin.entity.collisions.intersection=false
